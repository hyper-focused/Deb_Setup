# /etc/rsyslog.d/99-remote.conf — remote syslog forwarding
# Deployed by hyper-focused/Deb_Setup init.sh
# Forwards *all facilities* at RSYSLOG_SEVERITY and above via UDP to LibreNMS/rsyslog.
# Placeholders substituted by init.sh: RSYSLOG_SEVERITY, RSYSLOG_SERVER
# To change: edit this file and run: systemctl restart rsyslog
#
# Server-side (LibreNMS): receive UDP 514 and pipe to syslog.php via omprog:
# https://docs.librenms.org/Extensions/Syslog/

*.RSYSLOG_SEVERITY    @RSYSLOG_SERVER:514
