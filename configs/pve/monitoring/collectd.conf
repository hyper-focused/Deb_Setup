# /etc/collectd/collectd.conf — Proxmox VE (bare metal)
# Deployed by hyper-focused/Deb_Setup init.sh
# Remote LibreNMS only: network plugin → COLLECTD_SERVER:25826 (no local RRD write)

# ── Global ────────────────────────────────────────────────────────────────────
Hostname    "COLLECTD_HOSTNAME"
FQDNLookup  false
Interval    60
Timeout     2
ReadThreads 3

# ── Logging ───────────────────────────────────────────────────────────────────
LoadPlugin syslog
<Plugin syslog>
    LogLevel info
</Plugin>

# ── Core metrics ──────────────────────────────────────────────────────────────
LoadPlugin cpu
<Plugin cpu>
    ReportByCpu        true
    ReportByState      true
    ValuesPercentage   true
</Plugin>

LoadPlugin memory
<Plugin memory>
    ValuesAbsolute   true
    ValuesPercentage true
</Plugin>

LoadPlugin load

# Block device I/O — ignore loop/ram/zvol noise on hypervisors
LoadPlugin disk
<Plugin disk>
    Disk "/^loop[0-9]+$/"
    Disk "/^ram[0-9]+$/"
    Disk "/^zd[0-9]+$/"
    IgnoreSelected true
</Plugin>

# Filesystem capacity (LibreNMS disk-space graphs)
LoadPlugin df
<Plugin df>
    FSType "tmpfs"
    FSType "devtmpfs"
    FSType "squashfs"
    FSType "overlay"
    FSType "rpc_pipefs"
    FSType "devpts"
    FSType "proc"
    FSType "sysfs"
    IgnoreSelected true
    ValuesAbsolute true
    ValuesPercentage true
</Plugin>

# Host uplinks only — skip guest taps / firewall bridges
LoadPlugin interface
<Plugin interface>
    Interface "lo"
    Interface "/^tap/"
    Interface "/^fwbr/"
    Interface "/^fwln/"
    Interface "/^fwpr/"
    Interface "/^veth/"
    IgnoreSelected true
</Plugin>

LoadPlugin processes
LoadPlugin swap
LoadPlugin users
LoadPlugin uptime
LoadPlugin entropy

# ── Bare-metal extras ─────────────────────────────────────────────────────────
LoadPlugin irq
LoadPlugin contextswitch

# lm-sensors (requires lm-sensors package + sensors-detect)
LoadPlugin sensors

# ZFS ARC stats (PVE host storage)
LoadPlugin zfs_arc

# ── Network sender → LibreNMS collectd listener ───────────────────────────────
LoadPlugin network
<Plugin network>
    <Server "COLLECTD_SERVER" "25826">
    </Server>
</Plugin>

# ── Drop-in configs ───────────────────────────────────────────────────────────
Include "/etc/collectd/collectd.conf.d/"
