# /etc/collectd/collectd.conf — Debian 13 (QEMU VM)
# Deployed by hyper-focused/Deb_Setup init.sh
# Remote LibreNMS only: network plugin → COLLECTD_SERVER:25826 (no local RRD write)
# Guest-light: no sensors / zfs_arc / irq / swap (host owns those layers)

# ── Global ────────────────────────────────────────────────────────────────────
Hostname    "COLLECTD_HOSTNAME"
FQDNLookup  false
Interval    60
Timeout     2
ReadThreads 3

# ── Logging ───────────────────────────────────────────────────────────────────
LoadPlugin syslog
<Plugin syslog>
    LogLevel info
</Plugin>

# ── Core metrics ──────────────────────────────────────────────────────────────
LoadPlugin cpu
<Plugin cpu>
    ReportByCpu      true
    ReportByState    true
    ValuesPercentage true
</Plugin>

LoadPlugin memory
<Plugin memory>
    ValuesAbsolute   true
    ValuesPercentage true
</Plugin>

LoadPlugin load

# Block device I/O — ignore virtual devices
LoadPlugin disk
<Plugin disk>
    Disk "/^loop[0-9]+$/"
    Disk "/^ram[0-9]+$/"
    IgnoreSelected true
</Plugin>

# Filesystem capacity (LibreNMS disk-space graphs)
LoadPlugin df
<Plugin df>
    FSType "tmpfs"
    FSType "devtmpfs"
    FSType "squashfs"
    FSType "overlay"
    FSType "rpc_pipefs"
    FSType "devpts"
    FSType "proc"
    FSType "sysfs"
    IgnoreSelected true
    ValuesAbsolute true
    ValuesPercentage true
</Plugin>

LoadPlugin interface
<Plugin interface>
    Interface "lo"
    IgnoreSelected true
</Plugin>

LoadPlugin processes
LoadPlugin users
LoadPlugin uptime

# ── Network sender → LibreNMS collectd listener ───────────────────────────────
LoadPlugin network
<Plugin network>
    <Server "COLLECTD_SERVER" "25826">
    </Server>
</Plugin>

# ── Drop-in configs ───────────────────────────────────────────────────────────
Include "/etc/collectd/collectd.conf.d/"
